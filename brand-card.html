<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magewa — Brand Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #FAF7F2;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      font-family: 'Inter', system-ui, sans-serif;
      color: #2C2A28;
    }

    .card {
      background-color: #FFFFFF;
      border: 1px solid #E2DDD5;
      border-radius: 12px;
      max-width: 480px;
      width: 100%;
      padding: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .ring {
      width: 64px;
      height: 64px;
      border: 3px solid #C4944A;
      border-radius: 50%;
      margin-bottom: 32px;
      position: relative;
    }

    .ring::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 8px;
      height: 8px;
      background-color: #C4944A;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    .name {
      font-family: 'Crimson Pro', Georgia, serif;
      font-size: 3rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: #2C2A28;
      margin-bottom: 8px;
    }

    .tagline {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 1rem;
      font-weight: 400;
      line-height: 1.6;
      color: #8C7E6F;
      margin-bottom: 32px;
    }

    .divider {
      width: 100%;
      height: 1px;
      background-color: #E2DDD5;
      margin-bottom: 32px;
    }

    .kanji {
      font-family: 'Crimson Pro', Georgia, serif;
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #2C2A28;
      margin-bottom: 16px;
    }

    .story {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 0.875rem;
      font-weight: 400;
      line-height: 1.65;
      color: #8C7E6F;
      max-width: 360px;
      margin-bottom: 32px;
    }

    .palette {
      display: flex;
      gap: 8px;
      margin-bottom: 32px;
    }

    .swatch {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 1px solid #E2DDD5;
    }

    .badge {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #8C7E6F;
      background-color: #E2DDD5;
      border-radius: 9999px;
      padding: 4px 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="ring"></div>
    <div class="name">Magewa</div>
    <div class="tagline">Bind knowledge into deliverables.</div>
    <div class="divider"></div>
    <div class="kanji">曲輪</div>
    <div class="story">
      In Japanese craft, magewa are the bentwood rings that hold a barrel
      together. Each ring is shaped by hand, applying just enough pressure
      to turn separate pieces into something that holds value.
    </div>
    <div class="palette">
      <div class="swatch" style="background-color: #2C2A28;" title="Primary"></div>
      <div class="swatch" style="background-color: #8C7E6F;" title="Secondary"></div>
      <div class="swatch" style="background-color: #C4944A;" title="Ring"></div>
      <div class="swatch" style="background-color: #FAF7F2;" title="Neutral"></div>
      <div class="swatch" style="background-color: #E2DDD5;" title="Border"></div>
    </div>
    <div class="badge">magewa.com</div>
  </div>
</body>
</html>
